name: Amor Fuzzia Build and Deploy on Merge

on:
  push:
    branches:
      - amor-fuzzia-master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.13.0"

      - name: Install AMor Fuzzia Dependencies
        run: npm install

      - name: Build AMor Fuzzia
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AMOR_FUZZIA }}
          channelId: live
          projectId: amor-fuzzia
